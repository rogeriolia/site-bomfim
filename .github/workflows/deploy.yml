# Deploy apenas do repositório site-bomfim → /opt/site-bomfim (fixo no env abaixo).
# Não toca /opt/bomfim nem o repositório bomfim.
name: Deploy site + API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bomfim
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /opt/site-bomfim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secrets SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          failed=0
          for pair in "SSH_HOST:SSH_HOST" "SSH_USER:SSH_USER" "SSH_KEY:SSH_PRIVATE_KEY"; do
            var="${pair%%:*}"
            label="${pair#*:}"
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "::error::Secret ausente: $label"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Veja docs/backend/deploy-ssh-github.md"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar zip (galeria no build)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build frontend
        run: npm ci && npm run build

      - name: Empacotar release
        run: |
          tar czf release.tgz \
            dist backend run.py requirements.txt .htaccess \
            api/schema.sql scripts/server deploy

      - name: Enviar release ao servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          source: "release.tgz"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true
          timeout: 120s
          command_timeout: 30m

      - name: Extrair e pós-deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            mkdir -p "${{ env.DEPLOY_PATH }}"
            cd "${{ env.DEPLOY_PATH }}"
            tar xzf release.tgz
            rm -f release.tgz
            test -f deploy/systemd/bomfim-site-api.service.example
            chmod +x scripts/server/*.sh
            bash scripts/server/post-deploy.sh